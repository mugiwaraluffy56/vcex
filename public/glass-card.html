<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid Glass Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main class="min-h-screen bg-gradient-to-br from-purple-700 via-indigo-700 to-blue-700 flex items-center justify-center p-6">
      <section class="max-w-md w-full backdrop-blur-xl bg-white/10 border border-white/20 rounded-2xl shadow-lg p-7">
        <span class="inline-flex rounded-full border border-white/20 bg-white/10 px-3 py-1 text-xs font-medium text-white/90">
          Private beta
        </span>

        <h1 class="mt-5 text-3xl font-semibold tracking-tight text-white">
          Liquid Glass Card
        </h1>

        <p class="mt-3 text-base leading-7 text-white/85">
          A soft translucent surface with strong blur, subtle border, and readable white text layered over a vivid purple-to-blue gradient.
        </p>
      </section>
    </main>
  </body>
</html>
