<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vcex</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="traffic">
          <span></span><span></span><span></span>
        </div>
        <div class="brand">
          <div class="brand-icon">v</div>
          <div>
            <h1>vcex</h1>
            <p>LAN video calls</p>
          </div>
        </div>
        <nav>
          <button class="nav-item selected">Call setup</button>
          <button class="nav-item">Network</button>
          <button class="nav-item">Devices</button>
        </nav>
      </aside>

      <section class="content">
        <header>
          <h2>Call setup</h2>
          <p>Host a local relay or join another vcex host.</p>
        </header>

        <section class="panel">
          <div class="row">
            <div class="row-icon host">H</div>
            <div class="row-copy">
              <h3>Host call</h3>
              <p>Start Elixir signaling and TURN relay on this Mac.</p>
              <code id="hostUrl">host URL appears here</code>
            </div>
            <button id="hostBtn">Start host</button>
          </div>

          <div class="row">
            <div class="row-icon join">J</div>
            <div class="row-copy">
              <h3>Join call</h3>
              <p>Connect to someone running vcex host.</p>
              <input id="joinUrl" value="http://localhost:4000" />
            </div>
            <button id="joinBtn">Join</button>
          </div>
        </section>

        <pre id="log"></pre>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
