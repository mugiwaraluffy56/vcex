name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  elixir:
    name: Elixir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run tests
        run: mix test
      - name: Smoke test
        run: elixir smoke_test.exs

  node:
    name: Desktop metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Check Tauri metadata
        run: npm run desktop:info

